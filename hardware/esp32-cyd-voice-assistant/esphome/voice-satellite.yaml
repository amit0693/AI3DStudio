# Bare ESP32 devkit + INMP441 (I2S mic) + MAX98357A (I2S amp/speaker) as a
# dedicated Home Assistant Assist voice satellite.
#
# Pins below are illustrative, not board-mandated like the CYD's — this is a
# plain devkit, so any free GPIO works for wiring EXCEPT: strapping pins
# (0, 2, 12, 15) and input-only pins (34-39) for anything that must be an
# output (BCLK/WS/DATA-out). Relabel to match however you actually wire it.
#
# voice_assistant / micro_wake_word / i2s_audio option names have moved across
# ESPHome releases as the voice pipeline matured. Validate before flashing:
#   esphome config voice-satellite.yaml
# and cross-check against esphome.io/components/voice_assistant.html for your
# installed version — this environment's network policy blocks esphome.io, so
# this file could not be checked against the live docs while writing it.
#
# Buying an M5Stack AtomEcho instead skips this wiring entirely: ESPHome's
# dashboard has a built-in "New Device" flow that generates a correct
# board-specific starter config for it — use that rather than this file if
# you go that route.

esphome:
  name: voice-satellite
  friendly_name: Voice Satellite

esp32:
  board: esp32dev
  framework:
    type: esp-idf   # esp-idf, not arduino — the voice pipeline components want it

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:

# Two separate I2S peripherals — mic in and speaker out don't share a bus here.
i2s_audio:
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO33
  - id: i2s_speaker_bus
    i2s_lrclk_pin: GPIO26
    i2s_bclk_pin: GPIO27

microphone:
  - platform: i2s_audio
    id: satellite_mic
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: GPIO32
    adc_type: external
    pdm: false

speaker:
  - platform: i2s_audio
    id: satellite_speaker
    i2s_audio_id: i2s_speaker_bus
    i2s_dout_pin: GPIO22
    dac_type: external

micro_wake_word:
  models:
    - model: okay_nabu
  on_wake_word_detected:
    - voice_assistant.start:

voice_assistant:
  id: va
  microphone: satellite_mic
  speaker: satellite_speaker
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:
  on_error:
    - micro_wake_word.start:

binary_sensor:
  - platform: status
    name: "Voice Satellite Online"
